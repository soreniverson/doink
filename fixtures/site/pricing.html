<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pricing</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; }
      .plan { border: 1px solid #ddd; padding: 1rem; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <h1>Pricing</h1>
    <div class="plan" data-plan="starter">
      <h2 class="plan-name">Starter</h2>
      <span class="plan-price">$0</span>
      <button class="choose" data-plan="starter">Choose Starter</button>
    </div>
    <div class="plan" data-plan="pro">
      <h2 class="plan-name">Pro</h2>
      <span class="plan-price">$49</span>
      <button class="choose" data-plan="pro">Choose Pro</button>
    </div>
    <a id="home-link" href="/index.html">Home</a>
  </body>
</html>
